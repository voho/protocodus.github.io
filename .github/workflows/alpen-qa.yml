name: Alpen game QA

on:
  pull_request:
    paths:
      - 'fun/alpen/**'
      - '.github/workflows/alpen-qa.yml'

permissions:
  contents: read

concurrency:
  group: alpen-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: fun/alpen

jobs:
  logic:
    name: Riding, terrain and render budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Fetch pinned source for paired CPU checks
        run: |
          curl --fail --silent --show-error --retry 3 --output "$RUNNER_TEMP/alpen-trail-before.js" "https://raw.githubusercontent.com/voho/protocodus.github.io/a3edd9d9cd0d3de13a384ea15e572df79a3dc60e/fun/alpen/js/trail.js"
          curl --fail --silent --show-error --retry 3 --output "$RUNNER_TEMP/alpen-terrain-before.js" "https://raw.githubusercontent.com/voho/protocodus.github.io/a3edd9d9cd0d3de13a384ea15e572df79a3dc60e/fun/alpen/js/terrain.js"
      - name: Check physics, controls, variety and rendering
        run: |
          for test in riding-check pause-charge-check camera-occlusion-check touch-input-check input-device-check shortcut-input-check controller-menu-check npc-collision-check flow-check side-hit-shape-check terrain-shadow-check terrain-worker-check models-check graphics-check gpu-timing-check instance-lod-check mobile-render-check hud-check trail-clods-check solid-index-check render-limit-check audio-check; do
            node "tests/$test.mjs"
          done
      - name: Check identical trail output and measure paired CPU paths
        run: |
          node tests/trail-normals-check.mjs "$RUNNER_TEMP/alpen-trail-before.js"
          node tests/shadow-install-benchmark.mjs "$RUNNER_TEMP/alpen-terrain-before.js"
  browser:
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, portrait, landscape, detail]
    name: Browser ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ALPEN_QA_PROFILE: ${{ matrix.profile }}
      ALPEN_BROWSER: chromium
      ALPEN_URL: http://127.0.0.1:8773/fun/alpen/
      ALPEN_SOFTWARE_GPU: '1'
      ALPEN_GPU_TIMERS: ${{ matrix.profile == 'desktop' && '1' || '0' }}
      ALPEN_QA_THUMBNAILS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Configure browser and artifact paths
        run: |
          echo "ALPEN_PLAYWRIGHT=$RUNNER_TEMP/alpen-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          echo "ALPEN_QA_OUTPUT=$RUNNER_TEMP/alpen-qa" >> "$GITHUB_ENV"
      - name: Install pinned browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/alpen-browser" --no-save --package-lock=false playwright@1.64.1
          node "$RUNNER_TEMP/alpen-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Serve the checkout
        run: |
          python3 -m http.server 8773 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/alpen-server.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null "$ALPEN_URL"; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Fetch fixed artwork baseline
        if: matrix.profile == 'detail'
        run: |
          mkdir -p "$RUNNER_TEMP/alpen-detail-before"
          for file in config terrain backdrop; do
            curl --fail --silent --show-error --retry 3 --output "$RUNNER_TEMP/alpen-detail-before/$file.js" "https://raw.githubusercontent.com/voho/protocodus.github.io/ebb84e902a97c7f97f7e4423544c49c1b21ed270/fun/alpen/js/$file.js"
          done
          echo "ALPEN_DETAIL_BASE=$RUNNER_TEMP/alpen-detail-before" >> "$GITHUB_ENV"
      - name: Check real gameplay and capture mountain scenes
        timeout-minutes: 25
        run: node tests/browser-ci-check.mjs
      - name: Save screenshots, scene reports and server log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: alpen-qa-${{ matrix.profile }}
          path: |
            ${{ runner.temp }}/alpen-qa/
            ${{ runner.temp }}/alpen-server.log
          retention-days: 7
