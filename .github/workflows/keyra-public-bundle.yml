name: Check deployed Keyra JavaScript fingerprint
on:
  push:
    branches: [qa/keyra-live-preset-values-20261126]
    paths: [.github/workflows/keyra-public-bundle.yml]
permissions:
  contents: read
jobs:
  origin:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Compare standard, cache-busted, and statically hosted public URLs
        run: |
          for url in "https://protocodus.cz/fun/keyra/dsp/core.mjs" "https://protocodus.cz/fun/keyra/dsp/core.mjs?deployment-check=60e54c6-$(date +%s)" "https://voho.github.io/fun/keyra/dsp/core.mjs?deployment-check=60e54c6"; do
            curl -fsSL --compressed --max-time 30 -D /tmp/response -w 'served URL %{url_effective}\n' "$url" -o /tmp/keyra-core.mjs
            grep -Ei '^(HTTP/|cache-control:|cf-cache-status:|cf-ray:|last-modified:|age:|etag:|server:|location:|date:|via:|x-cache:|x-served-by:)' /tmp/response || true
            echo "PUBLIC_BLOB $(git hash-object /tmp/keyra-core.mjs) $(wc -c < /tmp/keyra-core.mjs) $url"
          done
