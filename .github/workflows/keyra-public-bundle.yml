name: Verify public Keyra optimization after deployment
on:
  push:
    branches: [qa/keyra-live-preset-values-20261126]
    paths: [.github/workflows/keyra-public-bundle.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Verify custom-domain JavaScript blob after the production rebuild
        run: |
          expected=9b887e95ebd5115d9621361ad4c5c34cb43aa985
          canonical=https://protocodus.cz/fun/keyra/dsp/core.mjs
          for attempt in $(seq 1 30); do
            matched=0
            for url in "$canonical" "$canonical?release=d032447-$(date +%s)"; do
              if curl --retry 2 --retry-delay 1 -fsSL --compressed --max-time 18 -D /tmp/headers "$url" -o /tmp/core; then
                oid=$(git hash-object /tmp/core)
                echo "PUBLIC_BLOB $oid $(wc -c </tmp/core) $url"
                grep -Ei '^(cf-cache-status|cache-control|last-modified|etag|age):' /tmp/headers || true
                if test "$oid" = "$expected"; then matched=$((matched+1)); fi
              fi
            done
            if test "$matched" = 2; then exit 0; fi
            sleep 25
          done
          exit 1
