name: Tyran game QA

on:
  pull_request:
    paths:
      - 'fun/tyran/**'
      - '.github/workflows/tyran-qa.yml'

permissions:
  contents: read

concurrency:
  group: tyran-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  browser:
    name: Touch, missions and renderer coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TYRAN_BROWSER: chromium
      TYRAN_URL: http://127.0.0.1:8773/fun/tyran/
      TYRAN_SOFTWARE_GPU: '1'
      TYRAN_PERF_PROFILE: '0'
      TYRAN_PERF_SECONDS: '20'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Configure browser and artifact paths
        run: |
          echo "TYRAN_PLAYWRIGHT=$RUNNER_TEMP/tyran-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          echo "TYRAN_SCREENSHOTS=$RUNNER_TEMP/tyran-qa" >> "$GITHUB_ENV"
          echo "TYRAN_UI_OUTPUT=$RUNNER_TEMP/tyran-ui-qa" >> "$GITHUB_ENV"
          echo "TYRAN_FRAME_OUTPUT=$RUNNER_TEMP/tyran-frame-cost" >> "$GITHUB_ENV"
      - name: Check input and objective logic
        run: |
          node fun/tyran/tests/touch-input-check.mjs
          node fun/tyran/tests/objective-tracker-check.mjs
          node fun/tyran/tests/browser-options-check.mjs
          node fun/tyran/tests/adaptive-resolution-check.mjs
      - name: Install pinned browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/tyran-browser" --no-save --package-lock=false playwright@1.64.1
          node "$RUNNER_TEMP/tyran-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Serve the checkout
        id: server
        run: |
          python3 -m http.server 8773 --bind 127.0.0.1 > "$RUNNER_TEMP/tyran-server.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null "$TYRAN_URL"; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Check flight and touch input
        if: ${{ !cancelled() && steps.server.conclusion == 'success' }}
        timeout-minutes: 10
        run: node fun/tyran/tests/browser-check.mjs
      - name: Check mobile HUD layout
        if: ${{ !cancelled() && steps.server.conclusion == 'success' }}
        timeout-minutes: 15
        run: node fun/tyran/tests/unobstructed-arena-check.mjs
      - name: Check live objectives and checkpoint flow
        if: ${{ !cancelled() && steps.server.conclusion == 'success' }}
        timeout-minutes: 5
        run: node fun/tyran/tests/mission-browser-check.mjs
      - name: Check landscape GPU texture limits
        if: ${{ !cancelled() && steps.server.conclusion == 'success' }}
        timeout-minutes: 5
        run: node fun/tyran/tests/texture-limit-browser-check.mjs
      - name: Measure JavaScript frame cost
        if: ${{ !cancelled() && steps.server.conclusion == 'success' }}
        timeout-minutes: 5
        env:
          TYRAN_FRAME_MODE: js
        run: node fun/tyran/tests/frame-cost-check.mjs
      - name: Check software WebGL renderer
        if: ${{ !cancelled() && steps.server.conclusion == 'success' }}
        timeout-minutes: 5
        env:
          TYRAN_FRAME_MODE: gpu
        run: node fun/tyran/tests/frame-cost-check.mjs
      - name: Save screenshots, coverage reports and server log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tyran-qa
          path: |
            ${{ runner.temp }}/tyran-qa/
            ${{ runner.temp }}/tyran-ui-qa/
            ${{ runner.temp }}/tyran-frame-cost/
            ${{ runner.temp }}/tyran-server.log
          retention-days: 7
