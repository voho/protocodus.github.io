        <nav id="game-options" class="game-options" aria-label="Game options" hidden>
          <p class="construction" id="construction" hidden>Construction <strong id="construction-material"></strong></p>
          <div class="view-tools" role="group" aria-label="Battlefield zoom" data-analytics-ignore>
            <span>Zoom</span><button class="view-btn" id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
            <button class="zoom-readout" id="zoom-fit" title="Show the whole battlefield" aria-label="Fit battlefield">100%</button>
            <button class="view-btn" id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
          </div>
          <button class="option" id="sound-button" data-analytics-cta="hud_sound" data-analytics-action="sound" aria-label="Mute sound" aria-pressed="true" title="Mute sound"><svg class="icon" aria-hidden="true"><use href="#icon-sound"/></svg><span>Mute sound</span></button>
          <button class="option" id="fullscreen-button" data-analytics-cta="hud_fullscreen" data-analytics-action="fullscreen" aria-label="Enter fullscreen" title="Enter fullscreen"><svg class="icon" aria-hidden="true"><use href="#icon-expand"/></svg><span>Enter fullscreen</span></button>
          <button class="option" id="help-button" data-analytics-cta="hud_help" data-analytics-action="help"><svg class="icon" aria-hidden="true"><use href="#icon-help"/></svg>How to play</button>
          <a class="option" href="/fun/" data-analytics-cta="hud_back_games" data-analytics-action="exit_game"><svg class="icon" aria-hidden="true"><use href="#icon-next"/></svg>All games</a>
        </nav>
      </div>
      <div class="setup">
        <label class="picker" for="fort-size"><span>Size</span><select id="fort-size" aria-label="Fortress size" data-analytics-ignore><option value="small">Small</option><option value="medium">Medium</option><option value="large">Large</option></select></label>
        <label class="picker style-picker" for="fort-style"><span>Style</span><select id="fort-style" aria-label="Fortress style" data-analytics-ignore><option value="random">Random</option></select></label>
      </div>
      <div class="round-actions">
        <button id="new-button" class="nav-button new-fort" aria-label="New fortress" title="New fortress" data-analytics-cta="hud_new_fortress" data-analytics-action="new_mission"><svg class="icon" aria-hidden="true"><use href="#icon-map"/></svg><span>New fortress</span></button>
        <button id="restart-button" class="nav-button" aria-label="Restart" title="Restart" data-analytics-cta="hud_restart" data-analytics-action="restart"><svg class="icon" aria-hidden="true"><use href="#icon-restart"/></svg><span>Restart</span></button>
      </div>
    </section>

            <div class="slider"><div><label for="power"><svg class="icon"><use href="#icon-power"/></svg>Power</label><output id="power-value" for="power">75%</output></div><input id="power" type="range" step="0.01" min="25" max="100" value="75" aria-label="Launch power"></div>

          <div class="launch-control">

            <button class="fire-button" id="fire-button" data-analytics-ignore><svg class="icon"><use href="#icon-launch"/></svg><span>Fire catapult</span></button>

      </div>
    </section>
    <p class="aim-hint" id="aim-hint">Click to fire</p>

    <div id="dialog-body"></div>
  </div></dialog>

    <progress id="prep-progress" max="1" value="0" aria-label="Game preparation"></progress>
    <button class="secondary-button" id="prep-retry" data-analytics-ignore hidden>Try again</button>
  </div>
  <p class="sr-only" role="status" id="announcement"></p>
