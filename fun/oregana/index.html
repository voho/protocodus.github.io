  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./keys.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Oregana",
    "url": "https://protocodus.cz/fun/oregana/",
    "applicationCategory": "MultimediaApplication",
    "operatingSystem": "Web browser",
    "description": "A physically modelled, playable church organ with 51 stops."
  }
  </script>
  <script defer src="/assets/js/analytics.js"></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TZZVDH4B" height="0" width="0" style="display:none;visibility:hidden" title="Google Tag Manager"></iframe></noscript>
  <a class="skip-link" href="#console">Skip to instrument</a>
  <header class="masthead">
    <div class="topbar wrap">
      <!-- The case is from Oregana’s official organ artwork. -->
      <img class="organ-case" src="./organ-case.webp" width="870" height="580" alt="">
      <div class="identity"><h1>Oregana</h1><p>Physically modelled church organ</p></div>
      <nav aria-label="Site navigation">
        <a class="brand" href="/"><img width="22" height="22" src="/assets/images/logo.svg" alt="">Protocodus</a>
        <a href="/fun/">Fun</a>
        <a href="/product/oregana/">Oregana for Reason</a>
        <a href="https://www.reasonstudios.com/shop/browse/?developer=Protocodus">Rack Extension Store</a>
      </nav>
    </div>
  </header>
  <main id="console" class="wrap">
    <noscript><p>Enable JavaScript to play the organ.</p></noscript>
    <section class="console" aria-label="Playing console">
      <div class="transport">
        <div class="preset-readout">
          <span class="caption">Registration</span>
          <strong id="current-registration" aria-live="polite"></strong>
          <span id="stop-count"></span>
        </div>
        <div id="performance-controls"></div>
        <div class="connections">
          <div><span id="midi-status" class="status" role="status"></span><button type="button" id="midi-connect">Connect MIDI</button></div>
          <div><span id="audio-status" class="status" role="status">Sound off</span><button type="button" id="audio-start">Start audio</button></div>
        </div>
      </div>
      <div class="playing-surface">
        <section class="manuals" aria-label="Manuals and pedalboard">
          <div class="key-tools">
            <div id="manual-control"></div>
            <div class="octave-controls">
              <button type="button" id="octave-down" aria-label="Shift down one octave" title="Shift down one octave">−</button>
              <span id="keyboard-range" aria-live="polite">C3–C5</span>
              <button type="button" id="octave-up" aria-label="Shift up one octave" title="Shift up one octave">+</button>
            </div>
          </div>
          <div id="keyboard" role="group" aria-label="On-screen manuals and pedalboard"></div>
          <div class="key-footer">
            <div id="pedal-control"></div>
            <button type="button" id="panic">All notes off</button>
          </div>
          <p class="playing-hint">Click a key or play the letters shown. <kbd>[</kbd> and <kbd>]</kbd> shift octaves.</p>
        </section>
        <div class="jamb jamb-left" id="stops-left" aria-label="Hauptwerk and Positiv stops"></div>
        <div class="jamb jamb-right" id="stops-right" aria-label="Récit and Pedal stops"></div>
      </div>
    </section>
    <section id="settings-groups" aria-label="Organ settings"></section>
    <section id="registration" aria-labelledby="registration-heading">
      <h2 id="registration-heading">Registrations</h2>
      <div id="preset-bank"></div>
    </section>
  </main>
  <footer class="credits wrap">
    <span>© 2026 Protocodus</span>
    <a href="./dsp/LICENSE">License</a>
    <a href="./dsp/THIRD_PARTY_NOTICES.md">Notices</a>
  </footer>
</body>
</html>
